[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-servicing-agent"
version = "0.4.1"
description = "Evaluation-driven FDE Servicing Agent PoC with opt-in Snowflake history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<2",
    "pydantic>=2.9,<3",
    "streamlit>=1.40,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]
semantic = [
    "sentence-transformers>=3.4,<6",
]
snowflake = [
    "snowflake-connector-python>=3.12,<6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
servicing_agent = ["corpus/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "snowflake_integration: opt-in test against configured Snowflake history",
]

